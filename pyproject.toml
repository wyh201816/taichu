[project]
name = "taichu"
version = "0.1.0"
description = "太初 - 玄幻小说个人写作助手，基于 LangGraph 的多 Agent 写作系统"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pymongo>=4.13,<5",
    "opik>=2.2,<3",
    "vector-graph-rag==0.2.2",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-store-mongodb>=0.1.0",
    "tokenizers",
]

[project.scripts]
taichu = "taichu.main:main"
taichu-opik-benchmarks = "taichu.infrastructure.evaluations.general_agent_benchmark.opik_integration:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deepeval>=3.8,<4",
    "mypy>=2.1.0",
    "pytest>=8.3.0",
    "ruff>=0.15.20",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/taichu"]
